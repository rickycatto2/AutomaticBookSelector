# Reference only; do not apply without approval. Replace all placeholders locally.
tunnel: YOUR_TUNNEL_UUID
credentials-file: /etc/cloudflared/tunnel.json
ingress:
  # Optional single-receiver-token native API. Separate hostname, NOT the UI host.
  # cloudflared filters paths, not methods; the app checks exact method + raw target.
  - hostname: bookramp.yourdomain.com
    path: '^/api/v1/bookramp/(status|sessions)$'
    service: http://selector:5077
  # Prevent non-native paths on this hostname from reaching the app.
  - hostname: bookramp.yourdomain.com
    service: http_status:404
  # Human UI stays behind Access including tunnel audience enforcement.
  - hostname: selector.yourdomain.com
    service: http://selector:5077
    originRequest:
      access:
        required: true
        teamName: YOUR_TEAM_NAME
        audTag:
          - YOUR_ACCESS_APPLICATION_AUDIENCE
  - service: http_status:404
