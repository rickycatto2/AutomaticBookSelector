<!doctype html><meta charset="utf-8"><title>Matching browser tests</title>
<h1>Synthetic matching browser tests</h1><pre id="result">Running…</pre><div id="fixture"></div>
<script>
// Serve this file plus static/index.html and static/companion.js on loopback.
// Real browser DOM, virtual five-second timers, synthetic API only. No catalogue,
// credentials, paid API, Goodreads upload or ABS writes are used.
(async () => {
  const assert = (value, reason) => {if (!value) throw Error(reason);};
  const html = await (await fetch('../static/index.html')).text();
  const source = await (await fetch('../static/companion.js')).text();
  const books = Array.from({length: 30}, (_, i) => ({id: 'abs-' + i, title: 'Synthetic ' + i,
    original_title: 'Synthetic ' + i, author: 'Writer', original_author: 'Writer', isbn: '', url: '',
    completed_date: '2026-10-01', reason: 'Review', provenance: 'Synthetic', ready: false}));
  let job = null, calls = [], clock = 0, hold = false, release, frame, w;
  const tick = () => new Promise(resolve => setTimeout(resolve, 0));
  async function mount() {
    if (frame) frame.remove();
    frame = document.createElement('iframe'); document.querySelector('#fixture').append(frame);
    frame.srcdoc = html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, '');
    await new Promise(resolve => frame.onload = resolve); w = frame.contentWindow;
    w.$ = s => w.document.querySelector(s);
    w.el = (tag, cls = '', text = '') => {const e = w.document.createElement(tag); e.className = cls; e.textContent = text; return e;};
    w.message = () => {};
    w.action = async (button, fn) => {await fn();};
    w.timers = [];
    w.setTimeout = (fn, delay) => {const timer = {fn, delay}; w.timers.push(timer); return timer;};
    w.clearTimeout = timer => {w.timers = w.timers.filter(t => t !== timer);};
    w.api = async (path, payload) => {
      if (path === '/api/goodreads') return {books, batches: [], excluded: 3000, match_job: structuredClone(job)};
      if (path === '/api/goodreads/match-batch') {job ||= {id: 'synthetic-job', items: books.filter(b => b.match_eligible !== false || b.retry_eligible).slice(0, 25).map(b => ({id: b.id, state: 'queued'}))}; return {job: structuredClone(job)};}
       if (path === '/api/goodreads/retry-provider') {job = {id: 'synthetic-retry', items: books.filter(b => b.retry_eligible).slice(0, 25).map(b => ({id: b.id, state: 'queued'}))}; return {job: structuredClone(job)};}
       if (path === '/api/goodreads/recheck') {job ||= {id: 'synthetic-recheck', items: books.filter(b => b.recheck_eligible).slice(0, 25).map(b => ({id: b.id, state: 'queued'}))}; return {job: structuredClone(job)};}
      if (path === '/api/goodreads/resolve') {
        assert(payload.book_ids.length === 1, 'exactly one ABS ID per request');
        const entry = job.items.find(i => i.id === payload.book_ids[0]);
        assert(entry && entry.state === 'queued', 'no saved/failed/repeated IDs');
        calls.push({id: entry.id, clock});
        if (hold) await new Promise(resolve => release = resolve);
        entry.state = ['ready', 'review', 'skipped', 'provider_error'][Number(entry.id.split('-')[1]) % 4];
        return {job: structuredClone(job), results: [{id: entry.id, automatic: entry.state === 'ready'}]};
      }
      throw Error('Unexpected API ' + path);
    };
    w.eval(source); await w.loadGoodreads(false);
  }
  async function advance() {const timer = w.timers.shift(); assert(timer && timer.delay === 5000, 'five-second pacing'); clock += timer.delay; timer.fn(); await tick();}
  await mount();
  let run = w.matchEligibleBooks(); await tick();
  assert(w.$('#gr-books').inert, 'forms protected during batch');
  await advance();
  assert(calls.length === 1 && /1 \/ 25/.test(w.$('#gr-match-progress').textContent), 'visible partial progress');
  w.$('#gr-match-cancel').click(); await run;
  assert(calls.length === 1 && /Paused/.test(w.$('#gr-match-progress').textContent), 'cancel during pacing stops requests');
  await mount(); // Page close/reopen: durable server fixture, not browser memory.
  assert(/resume/.test(w.$('#gr-match-eligible').textContent), 'resume offered after reopen');
  hold = true; run = w.matchEligibleBooks(); await tick(); await advance();
  w.$('#gr-match-cancel').click();
  assert(calls.length === 2, 'only one request in flight');
  release(); await run; hold = false;
  assert(calls.length === 2 && /Paused/.test(w.$('#gr-match-progress').textContent), 'cancel preserves in-flight result');
  await mount(); run = w.matchEligibleBooks(); await tick();
  for (let i = 2; i < 25; i++) await advance();
  await run;
  assert(calls.length === 25 && new Set(calls.map(c => c.id)).size === 25, 'bounded 25, no repeats or seed entries');
  assert(calls.every((c, i) => !i || c.clock - calls[i-1].clock >= 5000), 'provider pacing respected');
  assert(/25 \/ 25 processed · 7 ready · 6 review · 6 skipped · 6 provider errors/.test(w.$('#gr-match-progress').textContent), 'all outcome counts visible');
  assert(!w.$('#gr-books').inert && !w.$('#gr-match-eligible').disabled, 'controls restored');
  books[0].provider_error = true; books[0].retry_eligible = true;
  books[0].reason = 'Google Books [daily_quota]: Daily quota exceeded (HTTP 429).';
  await mount();
  const card = w.$('#gr-books').firstElementChild;
  assert(card.textContent.includes('Lookup could not run; export stays blocked.') && !card.querySelector('p').textContent.includes('Review required'), 'provider block is not review');
  assert(card.querySelector('input[type=checkbox]').disabled, 'blocked export remains disabled');
  const retry = [...card.querySelectorAll('button')].find(b => b.textContent === 'Retry provider-blocked books (up to 25)');
  assert(retry, 'deliberate retry control offered');
  retry.click(); await tick(); await advance(); await tick();
  assert(calls.length === 26 && calls[25].id === books[0].id, 'retry only the provider-blocked book');
   assert(!w.$('#gr-books').inert, 'retry UI restored');
   // Migrated API shape: old reason remains as evidence, not the current status.
   books.forEach((book, i) => Object.assign(book, {match_eligible: false, retry_eligible: i < 19,
     provider_error: i < 19, reason: 'Public catalog unavailable or response invalid; review manually.',
     lookup_status: i < 19 ? 'Previous catalog lookup was blocked by a request failure. It can be retried; no match decision was made.' : ''}));
   job = null; await mount();
   const legacyCard = w.$('#gr-books').firstElementChild;
   assert(legacyCard.textContent.includes('It can be retried') && !legacyCard.textContent.includes('review manually.'), 'legacy reason does not mislabel current status');
   w.$('#gr-match-eligible').click(); await tick();
   assert(job.items.length === 19 && job.items.every(i => i.state === 'queued'), 'general button queues legacy-blocked set');
   w.$('#gr-match-cancel').click(); await tick();
   job = null; await mount();
   [...w.$('#gr-books').firstElementChild.querySelectorAll('button')].find(b => b.textContent === 'Retry provider-blocked books (up to 25)').click(); await tick();
   assert(job.items.length === 19 && job.items.every(i => i.state === 'queued'), 'retry button queues legacy-blocked set');
   w.$('#gr-match-cancel').click(); await tick();
    books.forEach((book, i) => Object.assign(book, {recheck_eligible: i > 0, retry_eligible: i === 0, provider_error: i === 0}));
    job = null; await mount();
    const recheck = [...w.$('#gr-books').children[1].querySelectorAll('button')].find(b => b.textContent === 'Re-check nothing found / ambiguous books (up to 25)');
    assert(recheck, 'explicit re-check control offered');
    const beforeRecheck = calls.length; recheck.click(); await tick();
    assert(job.items.length === 25 && job.items.every(i => i.id !== books[0].id), 're-check cap and provider exclusion');
    for (let i = 0; i < 25; i++) await advance();
    assert(calls.length === beforeRecheck + 25 && !w.$('#gr-books').inert, 're-check one-book pacing and controls restored');
    assert(calls.slice(beforeRecheck).every((c, i, rows) => !i || c.clock - rows[i-1].clock >= 5000), 're-check five-second pacing');
    books[1].original_author = 'Synthetic Voice - narrator'; books[1].author = 'Catalog Writer, Catalog Coauthor';
    await mount();
    const recoveredCard = w.$('#gr-books').children[1];
    assert(recoveredCard.textContent.includes('Synthetic Voice - narrator'), 'original ABS author remains visibly available');
    assert(recoveredCard.querySelector('input[name=author]').value === 'Catalog Writer, Catalog Coauthor', 'saved form uses full catalog authors');
    document.querySelector('#result').textContent = 'PASS: progress, 5-second rate, 25 cap, pause (waiting/in-flight), page-close resume, partial decisions and counts, honest blocked cards, explicit provider retry, legacy-blocked queues, and paced bounded re-check with provider exclusion.';
  document.title = 'PASS matching browser tests';
})().catch(error => {document.querySelector('#result').textContent = error.stack; document.title = 'FAIL matching browser tests';});
</script>
