<!doctype html><meta charset="utf-8"><title>Matching browser tests</title>
<h1>Synthetic matching browser tests</h1><pre id="result">Running…</pre><div id="fixture"></div>
<script>
// Serve this file plus static/index.html and static/companion.js on loopback.
// Real browser DOM, virtual five-second timers, synthetic API only. No catalogue,
// credentials, paid API, Goodreads upload or ABS writes are used.
(async () => {
  const assert = (value, reason) => {if (!value) throw Error(reason);};
  const html = await (await fetch('../static/index.html')).text();
  const source = await (await fetch('../static/companion.js')).text();
  const books = Array.from({length: 30}, (_, i) => ({id: 'abs-' + i, title: 'Synthetic ' + i,
    original_title: 'Synthetic ' + i, author: 'Writer', original_author: 'Writer', isbn: '', url: '',
    completed_date: '2026-10-01', reason: 'Review', provenance: 'Synthetic', ready: false}));
   let job = null, calls = [], clock = 0, hold = false, release, frame, w, batches = [], savedPayload, returnedPayload, importWrites = [], reconcileCalls = [];
  const tick = () => new Promise(resolve => setTimeout(resolve, 0));
  async function mount() {
    if (frame) frame.remove();
    frame = document.createElement('iframe'); document.querySelector('#fixture').append(frame);
    frame.srcdoc = html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, '').replace('href="/style.css"', 'href="/static/style.css"');
    await new Promise(resolve => frame.onload = resolve); w = frame.contentWindow;
    w.$ = s => w.document.querySelector(s);
    w.$('#goodreads').hidden = false;
    w.el = (tag, cls = '', text = '') => {const e = w.document.createElement(tag); e.className = cls; e.textContent = text; return e;};
    w.message = () => {};
    w.action = async (button, fn) => {await fn();};
    w.timers = [];
    w.setTimeout = (fn, delay) => {const timer = {fn, delay}; w.timers.push(timer); return timer;};
    w.clearTimeout = timer => {w.timers = w.timers.filter(t => t !== timer);};
    w.api = async (path, payload) => {
       if (path === '/api/goodreads') return {books, batches, excluded: 3000, match_job: structuredClone(job)};
        if (path === '/api/goodreads/save') {
         savedPayload = payload; Object.assign(books.find(b => b.id === payload.book_id), payload, {ready: true}); return {saved: true};
       }
       if (path.startsWith('/api/goodreads/batch-items')) return {items: [
         {id: books[1].id, title: books[1].title, author: books[1].author, isbn: 'B0CHYSM5M4', state: 'exported'},
         {id: books[2].id, title: books[2].title, author: books[2].author, isbn: '9780306406157', state: 'imported'}]};
        if (path === '/api/goodreads/return-to-review') {returnedPayload = payload; return {returned: true};}
        if (path === '/api/goodreads/confirm-imported') {importWrites.push(payload); return {confirmed_imported: true};}
        if (path === '/api/goodreads/reconcile') {
          reconcileCalls.push(payload);
          const failed = payload.text.startsWith('Failed:');
          const items = [1, 2, 3].map(i => ({id: books[i].id, title: books[i].title, author: 'Writer', state: 'exported', proposed_failed: failed && i === 1}));
          return {items, flagged: failed ? [books[1].title] : [], ambiguous: payload.text === 'unknown', unrecognized: payload.text === 'unknown', no_op: !payload.text, can_confirm_remaining: !!payload.text && payload.text !== 'unknown'};
        }
        if (path === '/api/goodreads/skip') {
          const book = books.find(b => b.id === payload.book_id); book.skipped = payload.ignored;
          book.ready = !book.skipped && !!book.confirmed; return {skipped: book.skipped};
        }
      if (path === '/api/goodreads/match-batch') {job ||= {id: 'synthetic-job', items: books.filter(b => b.match_eligible !== false || b.retry_eligible).slice(0, 25).map(b => ({id: b.id, state: 'queued'}))}; return {job: structuredClone(job)};}
       if (path === '/api/goodreads/retry-provider') {job = {id: 'synthetic-retry', items: books.filter(b => b.retry_eligible).slice(0, 25).map(b => ({id: b.id, state: 'queued'}))}; return {job: structuredClone(job)};}
       if (path === '/api/goodreads/recheck') {job ||= {id: 'synthetic-recheck', items: books.filter(b => b.recheck_eligible).slice(0, 25).map(b => ({id: b.id, state: 'queued'}))}; return {job: structuredClone(job)};}
       if (path === '/api/goodreads/resolve') {
         assert(payload.book_ids.length === 1, 'exactly one ABS ID per request');
         if (!payload.batch_id) return {results: [{candidate: {title: 'Catalog suggestion', author: 'Writer', isbn: '9780306406157'}, reason: 'Synthetic suggestion'}]};
        const entry = job.items.find(i => i.id === payload.book_ids[0]);
        assert(entry && entry.state === 'queued', 'no saved/failed/repeated IDs');
        calls.push({id: entry.id, clock});
        if (hold) await new Promise(resolve => release = resolve);
        entry.state = ['ready', 'review', 'skipped', 'provider_error'][Number(entry.id.split('-')[1]) % 4];
        return {job: structuredClone(job), results: [{id: entry.id, automatic: entry.state === 'ready'}]};
      }
      throw Error('Unexpected API ' + path);
    };
    w.eval(source); await w.loadGoodreads(false);
  }
  async function advance() {const timer = w.timers.shift(); assert(timer && timer.delay === 5000, 'five-second pacing'); clock += timer.delay; timer.fn(); await tick();}
  await mount();
  let run = w.matchEligibleBooks(); await tick();
  assert(w.$('#gr-books').inert, 'forms protected during batch');
  await advance();
  assert(calls.length === 1 && /1 \/ 25/.test(w.$('#gr-match-progress').textContent), 'visible partial progress');
  w.$('#gr-match-cancel').click(); await run;
  assert(calls.length === 1 && /Paused/.test(w.$('#gr-match-progress').textContent), 'cancel during pacing stops requests');
  await mount(); // Page close/reopen: durable server fixture, not browser memory.
  assert(/resume/.test(w.$('#gr-match-eligible').textContent), 'resume offered after reopen');
  hold = true; run = w.matchEligibleBooks(); await tick(); await advance();
  w.$('#gr-match-cancel').click();
  assert(calls.length === 2, 'only one request in flight');
  release(); await run; hold = false;
  assert(calls.length === 2 && /Paused/.test(w.$('#gr-match-progress').textContent), 'cancel preserves in-flight result');
  await mount(); run = w.matchEligibleBooks(); await tick();
  for (let i = 2; i < 25; i++) await advance();
  await run;
  assert(calls.length === 25 && new Set(calls.map(c => c.id)).size === 25, 'bounded 25, no repeats or seed entries');
  assert(calls.every((c, i) => !i || c.clock - calls[i-1].clock >= 5000), 'provider pacing respected');
   assert(/25 \/ 25 processed · 7 suggested \(Save required\) · 6 review · 6 skipped · 6 provider errors/.test(w.$('#gr-match-progress').textContent), 'all outcome counts visible');
  assert(!w.$('#gr-books').inert && !w.$('#gr-match-eligible').disabled, 'controls restored');
  books[0].provider_error = true; books[0].retry_eligible = true;
  books[0].reason = 'Google Books [daily_quota]: Daily quota exceeded (HTTP 429).';
  await mount();
  const card = w.$('#gr-books').firstElementChild;
  assert(card.textContent.includes('Lookup could not run; export stays blocked.') && !card.querySelector('p').textContent.includes('Review required'), 'provider block is not review');
  assert(card.querySelector('input[type=checkbox]').disabled, 'blocked export remains disabled');
  const retry = [...card.querySelectorAll('button')].find(b => b.textContent === 'Retry provider-blocked books (up to 25)');
  assert(retry, 'deliberate retry control offered');
  retry.click(); await tick(); await advance(); await tick();
  assert(calls.length === 26 && calls[25].id === books[0].id, 'retry only the provider-blocked book');
   assert(!w.$('#gr-books').inert, 'retry UI restored');
   // Migrated API shape: old reason remains as evidence, not the current status.
   books.forEach((book, i) => Object.assign(book, {match_eligible: false, retry_eligible: i < 19,
     provider_error: i < 19, reason: 'Public catalog unavailable or response invalid; review manually.',
     lookup_status: i < 19 ? 'Previous catalog lookup was blocked by a request failure. It can be retried; no match decision was made.' : ''}));
   job = null; await mount();
   const legacyCard = w.$('#gr-books').firstElementChild;
   assert(legacyCard.textContent.includes('It can be retried') && !legacyCard.textContent.includes('review manually.'), 'legacy reason does not mislabel current status');
   w.$('#gr-match-eligible').click(); await tick();
   assert(job.items.length === 19 && job.items.every(i => i.state === 'queued'), 'general button queues legacy-blocked set');
   w.$('#gr-match-cancel').click(); await tick();
   job = null; await mount();
   [...w.$('#gr-books').firstElementChild.querySelectorAll('button')].find(b => b.textContent === 'Retry provider-blocked books (up to 25)').click(); await tick();
   assert(job.items.length === 19 && job.items.every(i => i.state === 'queued'), 'retry button queues legacy-blocked set');
   w.$('#gr-match-cancel').click(); await tick();
    books.forEach((book, i) => Object.assign(book, {recheck_eligible: i > 0, retry_eligible: i === 0, provider_error: i === 0}));
    job = null; await mount();
    const recheck = [...w.$('#gr-books').children[1].querySelectorAll('button')].find(b => b.textContent === 'Re-check nothing found / ambiguous books (up to 25)');
    assert(recheck, 'explicit re-check control offered');
    const beforeRecheck = calls.length; recheck.click(); await tick();
    assert(job.items.length === 25 && job.items.every(i => i.id !== books[0].id), 're-check cap and provider exclusion');
    for (let i = 0; i < 25; i++) await advance();
    assert(calls.length === beforeRecheck + 25 && !w.$('#gr-books').inert, 're-check one-book pacing and controls restored');
    assert(calls.slice(beforeRecheck).every((c, i, rows) => !i || c.clock - rows[i-1].clock >= 5000), 're-check five-second pacing');
    books[1].original_author = 'Synthetic Voice - narrator'; books[1].author = 'Catalog Writer, Catalog Coauthor';
    await mount();
    const recoveredCard = w.$('#gr-books').children[1];
    assert(recoveredCard.textContent.includes('Synthetic Voice - narrator'), 'original ABS author remains visibly available');
     assert(recoveredCard.querySelector('input[name=author]').value === 'Catalog Writer, Catalog Coauthor', 'saved form uses full catalog authors');
     const manualForm = recoveredCard.querySelector('form'), detail = manualForm.querySelector('details');
     assert(!detail.open && manualForm.querySelector('input[name=isbn]').closest('details') === null, 'identifier visible outside closed details');
     assert(manualForm.querySelector('select[name=public_rating]').closest('details') === null, 'public stars visible without expanding');
     assert(recoveredCard.querySelector('img').getAttribute('src') === '/api/cover?id=abs-1', 'cover uses authenticated local ABS proxy');
     const google = [...manualForm.querySelectorAll('a')].find(a => a.textContent === 'Find Goodreads match');
      assert(google && google.closest('details') === null && google.href.startsWith('https://www.google.com/search?q='), 'Google button visible and encoded');
      const printGoogle = [...manualForm.querySelectorAll('a')].find(a => a.textContent === 'Find print/ebook edition');
      for (const link of [google, printGoogle]) {
        const url = new URL(link.href);
        assert(url.searchParams.get('q').includes('Catalog Writer audiobook') && !url.searchParams.get('q').includes('Catalog Coauthor'), 'both searches use audiobook and only first author');
      }
      manualForm.elements.title.value = '<svg onload="alert(1)"> &x=1# +';
      manualForm.elements.author.value = "O'Writer; Narrator";
      for (const link of [google, printGoogle]) {
        link.dispatchEvent(new w.Event('click')); // refresh href without opening a real search tab
        const url = new URL(link.href);
        assert(url.origin === 'https://www.google.com' && url.hash === '' && [...url.searchParams].length === 1, 'hostile fields cannot inject URL parameters');
        assert(!/[&+= #"'<>!()*]/.test(link.href.split('?q=')[1]), 'query fully percent encoded');
        assert(!url.searchParams.get('q').includes('Narrator'), 'semicolon truncates authors');
      }
      manualForm.elements.title.value = books[1].title; manualForm.elements.author.value = books[1].author;
      const skip = [...manualForm.querySelectorAll('button')].find(b => b.textContent === 'Skip this book');
      assert(skip && !skip.closest('details'), 'Skip this book visible without expanding details');
      assert(recoveredCard.textContent.includes('excluded from exports and Goodreads suggestions until you Restore to queue'), 'skip consequences and restore visible');
      const help = w.$('#gr-queue-help');
      assert(help.textContent.includes('How to clear your queue') && help.textContent.includes('Confirm imported') && help.textContent.includes('Skip this book') && help.textContent.includes('ambiguity'), 'queue help explains skip versus checked import confirmation');
       assert(importWrites.length === 0 && reconcileCalls.length === 0, 'page load never confirms imports');
     manualForm.elements.isbn.value = 'B0CHYSM5M4'; manualForm.elements.isbn.dispatchEvent(new w.Event('input', {bubbles: true}));
     [...manualForm.querySelectorAll('button')].find(b => b.textContent === 'Find work ISBN (free catalogs)').click(); await tick();
     assert(manualForm.elements.isbn.value === 'B0CHYSM5M4', 'manual ASIN survives catalog suggestion');
     manualForm.elements.public_rating.value = '5'; manualForm.requestSubmit(); await tick();
     assert(savedPayload.book_id === 'abs-1' && savedPayload.isbn === 'B0CHYSM5M4' && savedPayload.public_rating === 5 && savedPayload.confirmed, 'Save confirms export details with public-only stars');
     assert(w.$('#gr-selected').textContent === '1 selected' && !w.$('#gr-export').disabled, 'saved title selected for export');
      batches = [{id: 'old-batch', created_at: '2026-10-01', count: 2, failed: 0, imported: 1}]; await w.loadGoodreads(false);
      const disclosure = w.$('#gr-export-history');
      assert(!disclosure.open && disclosure.firstElementChild.tagName === 'SUMMARY', 'history default collapsed with native accessible summary');
      disclosure.firstElementChild.focus();
      assert(w.document.activeElement === disclosure.firstElementChild, 'native summary is keyboard focusable');
      disclosure.querySelector('summary').click();
      assert(disclosure.open && disclosure.contains(w.$('#gr-batch')) && disclosure.textContent.includes('Download again'), 'expanded history retains selector and download');
     const history = w.$('#gr-batches').querySelector('details'); history.open = true; await tick(); await tick();
     const returns = [...history.querySelectorAll('button')].filter(b => b.textContent === 'Return to review');
      assert(returns.length === 1 && history.textContent.includes('confirmed imported') && history.textContent.includes('exported-unconfirmed'), 'history lists individual states; only unconfirmed title offers return');
       assert(history.textContent.includes('Brings this one book back into the working queue.') && [...history.querySelectorAll('button')].some(b => b.textContent === 'Confirm imported'), 'individual history actions self explanatory');
       w.$('#gr-batch').value = 'old-batch'; w.$('#gr-reconcile-form').elements.output.value = 'Retained draft';
       disclosure.querySelector('summary').click(); disclosure.querySelector('summary').click();
       assert(history.open && w.$('#gr-batch').value === 'old-batch' && w.$('#gr-reconcile-form').elements.output.value === 'Retained draft', 'collapse preserves batch selection, title expansion and draft');
       w.$('#gr-reconcile-form').elements.output.value = '';
     returns[0].click(); await tick();
      assert(returnedPayload.batch_id === 'old-batch' && returnedPayload.book_id === 'abs-1', 'return targets a single old-batch title, not entire batch');
      const finish = w.$('#gr-reconcile-form'), clear = w.$('#gr-clear-imports');
      books[3].skipped = true; await w.loadGoodreads(false);
       assert(![...w.$('#gr-books').querySelectorAll('article')].some(c => c.textContent.includes(books[3].title)), 'skipped book absent from working cards');
       assert(!w.$('#gr-skipped').open && w.$('#gr-skipped-summary').textContent === 'Skipped (1)', 'skipped disclosure collapsed with count');
       w.$('#gr-skipped-summary').click();
       assert(w.$('#gr-skipped').open && w.$('#gr-skipped-list').textContent.includes(books[3].title), 'skipped title recoverable');
       w.$('#gr-skipped-list button').click(); await tick();
       assert(!books[3].skipped && [...w.$('#gr-books').querySelectorAll('article')].some(c => c.textContent.includes(books[3].title)), 'restore returns book to queue');
       const readyCard = [...w.$('#gr-books').querySelectorAll('article')].find(c => c.querySelector('input').getAttribute('aria-label') === 'Export ' + books[1].title);
       [...readyCard.querySelectorAll('button')].find(b => b.textContent === 'Skip this book').click(); await tick();
       assert(books[1].skipped && w.$('#gr-export').disabled, 'skip drops selected export eligibility');
       [...w.$('#gr-skipped-list').querySelectorAll('button')].find(b => b.getAttribute('aria-label') === 'Restore to queue: ' + books[1].title).click(); await tick();
       assert(!books[1].skipped && books[1].ready, 'restore preserves confirmed export readiness');
       books[3].skipped = true; await w.loadGoodreads(false);
      assert(clear.textContent.includes('I already imported these') && importWrites.length === 0, 'explicit clear control, no auto-clear');
      clear.click(); await tick();
      assert(importWrites.length === 0 && reconcileCalls.at(-1).preview, 'no-failure first step never mutates');
      assert(w.$('#gr-import-summary').textContent.includes('2 books will be marked imported') && w.$('#gr-import-summary').textContent.includes('1 skipped books'), 'empty report counts exclude skipped');
      finish.requestSubmit(); await tick();
      assert(importWrites.length === 2 && importWrites.every(p => p.book_id !== books[3].id), 'confirm step clears only verified non-skipped titles');
      finish.elements.output.value = 'Failed: 9780306406157'; finish.elements.output.dispatchEvent(new w.Event('input'));
      finish.elements.confirm_remaining.checked = true;
      finish.requestSubmit(); await tick();
      assert(w.$('#gr-import-summary').textContent.includes('1 books will be marked imported') && w.$('#gr-import-summary').textContent.includes('1 failed books will go back to review'), 'mixed exact keep/fail counts');
      assert(importWrites.length === 2 && reconcileCalls.at(-1).preview, 'mixed first step never mutates');
      finish.requestSubmit(); await tick();
      assert(!reconcileCalls.at(-1).preview && importWrites.length === 3, 'mixed confirm applies failures and verified remainder');
      finish.elements.output.value = 'unknown'; finish.elements.output.dispatchEvent(new w.Event('input'));
      clear.click(); await tick();
      assert(importWrites.length === 3 && !w.$('#gr-import-summary').textContent, 'unknown report cannot clear remainder');
      finish.elements.output.value = 'Imported: 9780306406157'; finish.elements.output.dispatchEvent(new w.Event('input'));
      clear.click(); await tick();
      assert(importWrites.length === 3 && w.$('#gr-import-summary').textContent.includes('0 failed books'), 'success-only clear still requires confirmation');
      finish.elements.output.value = ''; finish.elements.output.dispatchEvent(new w.Event('input'));
      assert(!w.$('#gr-import-summary').textContent, 'editing invalidates pending confirmation');
      document.querySelector('#result').textContent = 'PASS: bounded/paced matching, pause/resume, retries, visible covers/Google/identifier/public-stars/Save, collapsed details, manual identifier wins, save-selection, individual history return states, hidden/recoverable skipped titles and restored export readiness, collapsed accessible history retaining controls/drafts/selection, and explicit two-step batch clearing with exact import/failure/skip counts, empty/success-only reports and unknown-output blocking.';
  document.title = 'PASS matching browser tests';
})().catch(error => {document.querySelector('#result').textContent = error.stack; document.title = 'FAIL matching browser tests';});
</script>
