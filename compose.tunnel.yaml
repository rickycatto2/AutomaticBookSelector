services:
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    depends_on:
      selector:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${CF_TUNNEL_CONFIG_PATH:-./.cloudflare/config.yml}
        target: /etc/cloudflared/config.yml
        read_only: true
      - type: bind
        source: ${CF_TUNNEL_CREDENTIALS_PATH:-./.cloudflare/tunnel.json}
        target: /etc/cloudflared/tunnel.json
        read_only: true
    # No public/local ports or ABS/OpenAI credentials are passed to this service.
